name: IndexNow Ping

# 手动推送：在 Actions 页面运行，可选传入要提交的 URL 列表；
# 不传则自动拉取 https://<host>/sitemap.xml 中的全部 URL 提交给 IndexNow。
on:
  workflow_dispatch:
    inputs:
      host:
        description: '站点域名（如 ccw.kivotos.qzz.io 或镜像域名）'
        required: true
        default: 'ccw.kivotos.qzz.io'
      urls:
        description: '要提交的 URL（空格分隔，留空则使用 sitemap 全部 URL）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs "${{ inputs.host }}" ${{ inputs.urls }}
