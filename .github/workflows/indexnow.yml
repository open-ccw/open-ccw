name: IndexNow Ping

# 每次 master 分支有推送时，把 sitemap 中的全部 URL 提交给 IndexNow。
# Bing 对小站点的爬取预算极低，主动推送是让 Bing 及时发现新页面的主要手段。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit URLs to IndexNow
        env:
          KEY: e13f190b8bf84161b3b1acc7cc7a65cd
          HOST: ccw.kivotos.qzz.io
        run: |
          # 从 sitemap 提取 URL 并生成 JSON 请求体，写入临时文件后用 --data-binary 发送，
          # 避免内联 JSON 的 shell 引号转义问题
          URLS=$(grep -o '<loc>[^<]*</loc>' static/sitemap.xml | sed 's/<\/\?loc>//g' | jq -R . | jq -sc .)
          jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg keyLocation "https://$HOST/$KEY.txt" \
            --argjson urlList "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' > /tmp/body.json
          STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/body.json)
          echo "IndexNow response: $STATUS"
          cat /tmp/resp.txt || true
          # 200 表示 URL 已收录或此前已提交，202 表示已接受待处理
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning::IndexNow submission returned $STATUS"
          fi
